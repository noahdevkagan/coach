name: Test Gate

# The release workflow calls this (workflow_call), so EVERY release runs the
# full test gate on CI before anything is signed or published — the local
# pre-push gate can be skipped or unconfigured; this one cannot.
# workflow_dispatch lets you run the gate on demand without releasing.

on:
  workflow_dispatch:
  workflow_call:

jobs:
  gate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          XCODE_PATH="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 16.x on this runner image:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: |
          cd MeetingCoach
          xcodegen
          set -o pipefail
          # No signing on the gate — the runner has no identity; the release
          # job signs separately (same flags as scripts/package-release.sh).
          # Preserve xcodebuild's real exit code (a piped grep hid a compile
          # failure once — the .app skeleton exists before Swift compiles).
          xcodebuild -project MeetingCoach.xcodeproj -scheme MeetingCoach \
            -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              # Real diagnostics first ("error:" with context), then the tail —
              # a bare "error" grep matches compile-command flags and drowns
              # the actual failure (seen 2026-08-04).
              grep -E "(error|fatal error): " build.log | head -40
              echo "--- last 60 lines of build.log ---"
              tail -60 build.log
              exit 1
            }
          grep -m1 "BUILD SUCCEEDED" build.log
          test -x build/Build/Products/Debug/MeetMouse.app/Contents/MacOS/MeetMouse

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: MeetingCoach/build.log
          if-no-files-found: ignore

      # The real-time ASR transcript + echo suites are NOT run here: on
      # virtualized CI runners Parakeet underruns and scores ~35% WER vs the
      # 5% bar (validated 2026-07-17) — they need real hardware and stay in
      # the local push gate (scripts/push-gate.sh). CI enforces everything
      # deterministic.
      - name: Deterministic suites (nudges, rubric, detector, session, demo, hygiene)
        run: |
          bash tests/nudges/run.sh
          bash tests/rubric/run.sh
          bash tests/detector/run.sh
          bash tests/session/run.sh
          bash tests/demo/run.sh
          bash tests/granola/run.sh
          bash tests/hygiene/run.sh

      # The compare-before-you-ship report: transcription accuracy + Them
      # turn shape per committed corpus and nudge quality, each against the
      # previous recorded run. Rendered into the job summary so every
      # release run shows the numbers on its Actions page before anything
      # is signed or published. Read-only here — records accrue from the
      # local push gate, where real saved sessions live.
      - name: Ship scorecard
        run: python3 bench/scorecard.py --summary "$GITHUB_STEP_SUMMARY"
